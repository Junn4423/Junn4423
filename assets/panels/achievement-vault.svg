<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="305" viewBox="0 0 1200 305">
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#0BBE00"/>
      <stop offset=".52" stop-color="#5BCDEC"/>
      <stop offset="1" stop-color="#FF4ECD"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="303" rx="18" fill="#0D1117" stroke="#30363D"/>
  <rect x="20" y="22" width="1160" height="44" rx="10" fill="#10161D" stroke="#30363D"/>
  <circle cx="44" cy="44" r="5" fill="#0BBE00" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="62" y="49" fill="#C9D1D9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700">ACHIEVEMENT SYNC // LOCAL DISPLAY</text>
  <text x="1154" y="49" text-anchor="end" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">CLICK PANEL → GITHUB ACHIEVEMENTS</text>

  <!-- QUICKDRAW -->
  <g transform="translate(42 94)">
    <rect width="340" height="160" rx="16" fill="#10161D" stroke="#30363D"/>
    <path d="M30 30h50M55 5v50M37 12l36 36M73 12L37 48" stroke="#0BBE00" stroke-width="3" opacity=".18"/>
    <circle cx="55" cy="42" r="22" fill="none" stroke="#0BBE00" stroke-width="3"/>
    <circle cx="55" cy="42" r="8" fill="none" stroke="#0BBE00" stroke-width="3"/>
    <path d="M55 12v12M55 60v12M25 42h12M73 42h12" stroke="#0BBE00" stroke-width="3" stroke-linecap="round"/>
    <text x="102" y="35" fill="#0BBE00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2">ACH-01</text>
    <text x="102" y="62" fill="#C9D1D9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700">QUICKDRAW</text>
    <rect x="102" y="80" width="116" height="29" rx="7" fill="#0BBE00" opacity=".15" stroke="#0BBE00"/>
    <text x="160" y="99" text-anchor="middle" fill="#0BBE00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700">UNLOCKED</text>
    <text x="24" y="137" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">speedrun.complete = true</text>
  </g>

  <!-- YOLO -->
  <g transform="translate(430 94)">
    <rect width="340" height="160" rx="16" fill="#10161D" stroke="#30363D"/>
    <path d="M54 15L33 53h18l-5 29 29-44H57z" fill="none" stroke="#5BCDEC" stroke-width="3" stroke-linejoin="round"/>
    <text x="102" y="35" fill="#5BCDEC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2">ACH-02</text>
    <text x="102" y="62" fill="#C9D1D9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700">YOLO</text>
    <rect x="102" y="80" width="116" height="29" rx="7" fill="#5BCDEC" opacity=".15" stroke="#5BCDEC"/>
    <text x="160" y="99" text-anchor="middle" fill="#5BCDEC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700">UNLOCKED</text>
    <text x="24" y="137" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">review.required = false</text>
  </g>

  <!-- PULL SHARK -->
