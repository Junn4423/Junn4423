    <path d="M22 62c11-27 28-41 49-42-4 9-2 17 7 24-10-2-18 1-24 8 11 0 21 6 27 17-14 10-34 13-59 8z" fill="none" stroke="#FF4ECD" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="64" cy="45" r="2.5" fill="#FF4ECD"/>
    <text x="102" y="35" fill="#FF4ECD" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2">ACH-03</text>
