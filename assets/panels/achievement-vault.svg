    <rect x="102" y="80" width="116" height="29" rx="7" fill="#FF4ECD" opacity=".15" stroke="#FF4ECD"/>
    <text x="160" y="99" text-anchor="middle" fill="#FF4ECD" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700">UNLOCKED</text>
